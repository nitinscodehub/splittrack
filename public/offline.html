<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · SplitTrack</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(at 15% 20%, rgba(99, 102, 241, 0.22), transparent 45%),
          radial-gradient(at 85% 80%, rgba(168, 85, 247, 0.18), transparent 45%),
          #f7f5ff;
        color: #1e1b4b;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        padding: 40px 28px;
        box-shadow: 0 24px 60px -30px rgba(49, 46, 129, 0.45);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(135deg, #4f46e5, #a855f7);
        color: white;
        font-weight: 800;
        font-size: 24px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 24px;
        color: #6b7280;
        line-height: 1.6;
        font-size: 14px;
      }
      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 22px;
        font-weight: 700;
        color: white;
        cursor: pointer;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0a16;
          color: #ede9fe;
        }
        .card {
          background: rgba(20, 18, 34, 0.9);
          border-color: rgba(255, 255, 255, 0.08);
        }
        p {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">S</div>
      <h1>You're offline</h1>
      <p>
        SplitTrack needs a connection to sync your balances. Your spot is saved — reconnect and
        we'll pick up right where you left off.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
